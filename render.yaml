services:
  - type: web
    name: banner-generator
    env: python
    plan: free
    region: oregon
    branch: main  # или твоя ветка
    buildCommand: pip install -r requirements.txt
    startCommand: flask run --host=0.0.0.0 --port $PORT
    envVars:
      - key: FLASK_ENV
        value: production
